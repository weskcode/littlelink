<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en"> <!-- Update `class="theme-auto"` with your preference -->

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>Wes Keetch</title>
    <link rel="icon" type="image/png" href="images/avatar.png"> <!-- Update this with your own favicon -->

    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="Wes Keetch — iOS developer in NYC. GitHub, X, LinkedIn, and links to NeuroNook, RHOIDS, Words of Winter, QuoteReaper, and SunHat.">

    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <link rel="canonical" href="https://weskcode.github.io/littlelink/">

    <!-- Author Information -->
    <meta name="author" content="Wes Keetch">

    <!-- Browser UI Color - Matches the default light/dark theme backgrounds -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

    <!-- Social Sharing (Open Graph & Twitter) - Uncomment and fill in to control how your page
         looks when shared on social platforms and in chat apps.
         og:url and og:image must be full absolute URLs. -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Wes Keetch">
    <meta property="og:description" content="iOS developer in NYC. GitHub, X, LinkedIn, and links to NeuroNook, RHOIDS, Words of Winter, QuoteReaper, and SunHat.">
    <meta property="og:url" content="https://weskcode.github.io/littlelink/">
    <meta property="og:image" content="https://weskcode.github.io/littlelink/images/avatar@2x.png">
    <meta name="twitter:card" content="summary">

    <!-- Font Preloads - Lets the browser fetch fonts in parallel with the stylesheets -->
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-800.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

    <!-- LittleLink Extended Stylesheet (Optional) -->
    <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
    <!-- Learn more at https://github.com/sethcottle/littlelink-extended.
         Remove comments if you've added LittleLink Extended dependencies -->

  </head>

<body>

    <div class="container">
        <div class="column">
          <main>

            <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
            <img class="avatar avatar--rounded" src="images/avatar.png" srcset="images/avatar@2x.png 2x" alt="Wes Keetch" width="128" height="128" fetchpriority="high">

            <!-- Replace with your name or brand -->
            <h1>Wes Keetch</h1>

            <!-- Add a short description about yourself or your brand -->
            <p>iOS developer in NYC. Building small, focused apps in Swift.</p>

            <!-- All your buttons go here -->
            <nav class="button-stack" aria-label="Links">

              <a class="button button-github" href="https://github.com/weskcode" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/github.svg" alt="GitHub Logo">GitHub</a>
              <a class="button button-x" href="https://x.com/weskcode" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/x.svg" alt="X Logo">Follow on X</a>
              <a class="button button-linked" href="https://www.linkedin.com/in/wesley-keetch/" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/linkedin.svg" alt="LinkedIn Logo">LinkedIn</a>

              <p class="link-group-label">Apps</p>
              <a class="button button-default" href="https://neuronook.apphq.online/" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-homepage.svg" alt="Website Icon">NeuroNook</a>
              <a class="button button-default" href="https://rhoids.apphq.online/" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-homepage.svg" alt="Website Icon">RHOIDS</a>
              <a class="button button-default" href="https://words-of-winter.apphq.online/" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-homepage.svg" alt="Website Icon">Words of Winter</a>
              <a class="button button-default" href="https://quotereaper.apphq.online/" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-homepage.svg" alt="Website Icon">QuoteReaper</a>
              <a class="button button-default" href="https://sunhat.apphq.online/" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-homepage.svg" alt="Website Icon">SunHat</a>

              <!--
                App Store group: add real listing URLs here as they ship, then
                uncomment the label + buttons below. Icon: images/icons/apple.svg,
                class: button-appstore.

                <p class="link-group-label">App Store</p>
                <a class="button button-appstore" href="#" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/apple.svg" alt="Apple Logo">NeuroNook on the App Store</a>
              -->

              <p class="link-group-label">Contact</p>
              <a class="button button-default" href="mailto:wesleyk@duck.com" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-email.svg" alt="Email Icon">Email me</a>

      </nav>
      </main>

      <!-- Feel free to add your own footer information, including updating `privacy.html` to reflect how your LittleLink fork is set up -->
      <footer>
        <a href="privacy.html">Privacy</a> | Built with <a href="https://littlelink.io" target="_blank" rel="noopener">LittleLink</a>
      </footer>

    </div>
  </div>

</body>

</html>
